services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - ledger-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://ledger:ledger@postgres:5432/ledger?schema=public"
      REDIS_URL: "redis://redis:6379"
      SESSION_TTL_DAYS: 30
      WEB_ORIGIN: "http://localhost:3000"
    ports:
      - "4000:4000"
    command: sh -c "pnpm --filter @ledger/database migrate:deploy && pnpm start"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:4000"
        NEXT_PUBLIC_WS_URL: "ws://localhost:4000/ws"
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  ledger-postgres-data:
